version: 2
updates:
  # Frontend npm
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kiev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    # Group minor + patch updates so we don't drown in tiny PRs
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend pip
  - package-ecosystem: "pip"
    directory: "/server/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kiev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kiev"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
