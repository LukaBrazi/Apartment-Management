name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Django unit tests ────────────────────────────────────────────────────
  test:
    name: Django Tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install django-storages==1.14.3 boto3==1.34.140
          pip install pytest pytest-django factory-boy faker

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python -m pytest apps/tests/ -v --tb=short

  # ── 2. Playwright E2E tests ─────────────────────────────────────────────────
  # Runs only when E2E_BASE_URL variable is set in repo settings.
  # Set it under: Settings → Secrets and variables → Actions → Variables
  # Example value: https://your-staging-url.vercel.app
  e2e:
    name: E2E Tests (Playwright)
    needs: test
    runs-on: ubuntu-latest
    if: vars.E2E_BASE_URL != ''

    steps:
      - name: Checkout E2E repo
        uses: actions/checkout@v4
        with:
          # Adjust to your GitHub username/org if the repo is private add a token:
          # token: ${{ secrets.E2E_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/sckandi-e2e
          path: e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

