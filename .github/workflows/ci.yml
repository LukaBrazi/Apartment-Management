name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Django unit tests ────────────────────────────────────────────────────
  test:
    name: Django Tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install django-storages==1.14.3 boto3==1.34.140
          pip install pytest pytest-django factory-boy faker

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python -m pytest apps/tests/ -v --tb=short

  # ── 2. Playwright E2E tests (Docker stack — no staging server needed) ────────
  # Spins up postgres + redis + server + client + nginx via docker-compose.ci.yml,
  # seeds demo data, then runs the sckandi-e2e Playwright suite against localhost.
  e2e:
    name: E2E Tests (Docker + Playwright)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Docker layer cache ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── Start services ──────────────────────────────────────────────────────
      - name: Build and start CI stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for server to become healthy
        run: |
          echo "Waiting for Django server (up to 5 min)..."
          for i in $(seq 1 60); do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$(docker compose -f docker-compose.ci.yml ps -q server)" 2>/dev/null || echo "unknown")
            echo "  attempt $i/60 — status: $STATUS"
            [ "$STATUS" = "healthy" ] && echo "Server ready!" && exit 0
            sleep 5
          done
          echo "Timeout: server never became healthy"
          docker compose -f docker-compose.ci.yml logs server
          exit 1

      # ── Seed demo users ─────────────────────────────────────────────────────
      - name: Seed demo data
        run: |
          docker compose -f docker-compose.ci.yml exec -T server \
            python manage.py seed_demo

      # ── Checkout E2E repo ───────────────────────────────────────────────────
      - name: Checkout E2E repo
        uses: actions/checkout@v4
        with:
          # If the repo is private, add: token: ${{ secrets.E2E_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/sckandi-e2e
          path: e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # ── Run tests ───────────────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --workers=1
        env:
          BASE_URL: http://localhost:8080

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

