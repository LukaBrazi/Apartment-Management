name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Django unit tests ────────────────────────────────────────────────────
  test:
    name: Django Tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install django-storages==1.14.3 boto3==1.34.140
          pip install pytest pytest-django factory-boy faker

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python -m pytest apps/tests/ -v --tb=short

  # ── 2. Dependency security scan (PR-8) ─────────────────────────────────────
  # Why ``continue-on-error: true``: pip-audit / npm audit will turn up
  # CVEs in transitive deps the moment we wire them in.  Blocking PRs
  # before we have a triage / suppression list would mean every author
  # gets a red merge button on day one.  After the first run we'll
  # collect findings into ``docs/SECURITY_BACKLOG.md``, fix or
  # whitelist them, then flip this to ``false`` so regressions block
  # merges.
  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          # ``--strict`` exits non-zero on any vulnerability — we still
          # swallow it via continue-on-error at the job level.  Once
          # SECURITY_BACKLOG is groomed, drop the OR branch and let
          # GitHub turn the step red.
          pip-audit -r server/requirements/production.txt --strict || \
            (echo "::warning::pip-audit found vulnerabilities — review and triage in docs/SECURITY_BACKLOG.md" && exit 0)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: client
        run: |
          # ``--audit-level=high`` filters out informational / low
          # advisories that bury the signal.  ``--omit=dev`` skips
          # devDependencies — only what ships to the browser matters.
          npm audit --audit-level=high --omit=dev || \
            (echo "::warning::npm audit found vulnerabilities — review and triage in docs/SECURITY_BACKLOG.md" && exit 0)

  # e2e + deploy — окремі workflows, плануються Q3 2026
