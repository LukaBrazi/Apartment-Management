name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Django unit tests ────────────────────────────────────────────────────
  test:
    name: Django Tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install django-storages==1.14.3 boto3==1.34.140
          pip install pytest pytest-django factory-boy faker

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python -m pytest apps/tests/ -v --tb=short

  # e2e + deploy — окремі workflows, плануються Q3 2026
