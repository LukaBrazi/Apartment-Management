upstream server {
    server server:8000;
}

upstream client {
    server client:3000;
}

server {
    listen 80;
    client_max_body_size 20M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;

    # WebSocket support (Next.js HMR)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://client/;
        access_log /var/log/nginx/client_access.log;
        error_log  /var/log/nginx/client_error.log error;
    }

    location /api/v1/ {
        proxy_pass http://server/api/v1/;
        access_log /var/log/nginx/server_access.log;
        error_log  /var/log/nginx/server_error.log error;
    }

    location /django-admin/ {
        proxy_pass http://server/django-admin/;
    }

    location /static/ {
        proxy_pass http://server/static/;
    }
}
