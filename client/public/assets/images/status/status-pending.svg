<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Background -->
  <rect width="320" height="200" rx="12" fill="#FFFBEB"/>
  <!-- Soft circle bg -->
  <circle cx="160" cy="90" r="64" fill="#F59E0B" opacity="0.12"/>
  <!-- Clock circle -->
  <circle cx="160" cy="90" r="42" fill="white" stroke="#F59E0B" stroke-width="3"/>
  <!-- Clock face marks -->
  <line x1="160" y1="52" x2="160" y2="58" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="122" x2="160" y2="128" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="90" x2="124" y2="90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="90" x2="202" y2="90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~11) -->
  <line x1="160" y1="90" x2="146" y2="68" stroke="#1C2B3A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~2) -->
  <line x1="160" y1="90" x2="178" y2="76" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="160" cy="90" r="4" fill="#F59E0B"/>
  <!-- "Awaiting" small dots animation hint -->
  <circle cx="148" cy="140" r="5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="160" cy="140" r="5" fill="#F59E0B" opacity="0.6"/>
  <circle cx="172" cy="140" r="5" fill="#F59E0B" opacity="0.3"/>
  <!-- Status label -->
  <rect x="90" y="156" width="140" height="28" rx="14" fill="#F59E0B"/>
  <text x="160" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Очікується</text>
</svg>
