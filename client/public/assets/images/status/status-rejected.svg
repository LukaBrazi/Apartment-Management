<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Background -->
  <rect width="320" height="200" rx="12" fill="#FFF1F0"/>
  <!-- Soft circle bg -->
  <circle cx="160" cy="90" r="64" fill="#C0392B" opacity="0.1"/>
  <!-- Large X circle -->
  <circle cx="160" cy="90" r="42" fill="#C0392B"/>
  <!-- Inner ring -->
  <circle cx="160" cy="90" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- X mark -->
  <line x1="142" y1="72" x2="178" y2="108" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="178" y1="72" x2="142" y2="108" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Warning dots -->
  <circle cx="102" cy="62" r="5" fill="#C0392B" opacity="0.35"/>
  <circle cx="218" cy="58" r="4" fill="#C0392B" opacity="0.35"/>
  <circle cx="220" cy="110" r="3" fill="#C0392B" opacity="0.25"/>
  <!-- Status label -->
  <rect x="100" y="156" width="120" height="28" rx="14" fill="#C0392B"/>
  <text x="160" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Відхилено</text>
</svg>
