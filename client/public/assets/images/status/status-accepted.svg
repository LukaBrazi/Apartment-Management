<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Background -->
  <rect width="320" height="200" rx="12" fill="#EEF3FD"/>
  <!-- Soft circle bg -->
  <circle cx="160" cy="90" r="64" fill="#4A90D9" opacity="0.12"/>
  <!-- CheckCircle2 icon (large 80px) -->
  <circle cx="160" cy="90" r="40" fill="white" stroke="#4A90D9" stroke-width="3"/>
  <!-- Checkmark -->
  <path d="M142 90 L155 103 L178 76" stroke="#4A90D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small badge indicator -->
