  <path d="M187 58 L191 62 L198 54" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Status label -->
  <rect x="100" y="156" width="120" height="28" rx="14" fill="#4A90D9"/>
  <text x="160" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Прийнято</text>
</svg>
