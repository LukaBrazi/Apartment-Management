[build]
builder = "nixpacks"
buildCommand = "cd server && pip install -r requirements/production.txt && python manage.py collectstatic --no-input"

[deploy]
startCommand = "cd server && python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
# Окремий сервіс Celery — додай вручну в Railway з такою командою:
# cd server && celery -A config.celery_app worker --loglevel=info --concurrency=1
