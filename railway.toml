[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# PR-7: liveness/readiness probe. Railway hits this URL after deploy
# and rolls back if it does not return 2xx within healthcheckTimeout.
# The endpoint pings DB + Redis and returns 503 on either failure
# (see server/apps/common/health.py).
healthcheckPath = "/api/v1/health/"
healthcheckTimeout = 30

[environments.production]
# Цей railway.toml описує основний web-сервіс (Django + Gunicorn).
# Для повноцінної роботи на Railway потрібні ще ДВА сервіси з того ж
# репо — створюються вручну в Railway dashboard:
#
# 1. Celery Worker
#    Start command:
#      celery -A config.celery_app worker --loglevel=info --concurrency=1
#    Env vars: всі ті ж що у web-сервіса (DATABASE_URL, CELERY_BROKER_URL,
#    DEMO_PASSWORD ...). DEMO_PASSWORD обов'язковий, бо worker виконує
#    nightly `seed_demo_reset` (див. server/apps/common/tasks.py) і
#    без env-паролю `--passwords-from-env` падає з CommandError.
#
# 2. Celery Beat
#    Start command:
#      celery -A config.celery_app beat --loglevel=info \
#        --scheduler django_celery_beat.schedulers:DatabaseScheduler
#    Replicas: рівно 1 — інакше schedule дублюватиметься.
#    Env vars: DATABASE_URL + CELERY_BROKER_URL достатньо (beat нічого
#    сам не виконує, лише ставить job у чергу worker-а).
#
# Schedule `seed-demo-reset-nightly` (23:00 Europe/Kyiv) описано
# декларативно у server/config/settings/base.py::CELERY_BEAT_SCHEDULE
# і автоматично потрапляє в django_celery_beat.PeriodicTask при першому
# запуску beat. Після цього schedule можна редагувати через Django Admin.
